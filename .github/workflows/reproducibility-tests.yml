name: Reproducibility utilities checks

on:
  pull_request:
  push:
    paths:
      - 'reproducibility/**'
      - '.github/workflows/reproducibility-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: python -m pip install -r reproducibility/requirements.txt
      - name: Test additional analysis utilities
        run: python -m unittest discover -s reproducibility/tests -v

      - name: Export source-grounded Bromo scenario and figure
        run: python reproducibility/scripts/source_grounded_bromo_scenario.py
      - name: Save audited scenario output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bromo-source-grounded-provisional
          path: |
            reproducibility/outputs/source-grounded/observed_bromo_visits.csv
            reproducibility/outputs/source-grounded/provisional_annual_mean_scenarios.csv
            reproducibility/outputs/source-grounded/bromo_provisional_visitor_scenario.png
          retention-days: 30
