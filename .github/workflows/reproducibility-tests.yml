name: Reproducibility utilities checks

on:
  pull_request:
  push:
    paths:
      - 'reproducibility/**'
      - '.github/workflows/reproducibility-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: python -m pip install -r reproducibility/requirements.txt
      - name: Test additional analysis utilities
        run: python -m unittest discover -s reproducibility/tests -v
